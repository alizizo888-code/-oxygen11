name: Oxygen11 CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate server syntax and database module
        run: npm run check

      - name: Run core tests
        run: |
          set -o pipefail
          node --test test/core.test.js 2>&1 | tee /tmp/core-test.log

      - name: Run security tests
        run: node --test test/security.test.js
