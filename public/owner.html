<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oxygen11 - المالك</title><style>body{font-family:Tahoma;background:#f4f7f6;margin:0;padding:20px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>لوحة المالك</h1><p id="auth">جاري التحقق...</p><div class="grid"><div class="card">إجمالي الطلبات<h2 id="total">0</h2></div><div class="card">قيد التوزيع<h2 id="pending">0</h2></div><div class="card">قيد التنفيذ<h2 id="progress">0</h2></div><div class="card">مكتملة<h2 id="done">0</h2></div></div><div class="card" style="margin-top:16px"><h3>الإيرادات</h3><h2 id="revenue">0 ر.س</h2><p id="commission"></p></div></div><script>async function load(){const m=await fetch('/api/auth/me');if(!m.ok){document.getElementById('auth').textContent='يجب تسجيل الدخول من البوابة الرئيسية.';return}const u=(await m.json()).user;if(!['owner','admin'].includes(u.role)){document.getElementById('auth').textContent='غير مصرح';return}document.getElementById('auth').textContent='الدور: '+u.role;const r=await fetch('/api/orders');const d=await r.json();const o=d.orders||[];document.getElementById('total').textContent=o.length;document.getElementById('pending').textContent=o.filter(x=>x.status==='pending_dispatch').length;document.getElementById('progress').textContent=o.filter(x=>x.status==='in_progress').length;document.getElementById('done').textContent=o.filter(x=>x.status==='completed').length;const rev=o.reduce((s,x)=>s+Number(x.pricing?.total||0),0);const com=o.reduce((s,x)=>s+Number(x.pricing?.commission||0),0);document.getElementById('revenue').textContent=rev.toFixed(2)+' ر.س';document.getElementById('commission').textContent='عمولة المنصة: '+com.toFixed(2)+' ر.س'}load();</script></body></html>
