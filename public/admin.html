<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السيادية | منصة مُتقن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #1a1a2e; color: #e6e6e6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #162447; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { color: #e43f5a; text-align: center; }
        .badge { background: #e43f5a; color: white; padding: 5px 10px; border-radius: 4px; font-size: 14px; }
        .card { background: #1f4068; padding: 15px; margin: 15px 0; border-radius: 6px; border-right: 5px solid #e43f5a; }
        button { background: #e43f5a; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #c2314a; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة التحكم السيادية - مُتقن</h1>
    <p>المشرف المالك: <strong>علي طلعت زيدان (آية)</strong> | <span class="badge">معرف السيادة: 789512364</span></p>

    <div class="card">
        <h3>حالة النظام العامة</h3>
        <p id="systemStatus">جارِ التحقق من الاتصال بالخادم...</p>
        <button onclick="checkSystemStatus()">فحص النظام</button>
    </div>

    <div class="card">
        <h3>طلبات انضمام الفنيين (المعلقة / الزائرين)</h3>
        <p>إدارة وقبول حسابات الفنيين الجديدة وتفعيل صلاحياتهم.</p>
        <button onclick="alert('خاصية اعتماد الفنيين جاهزة للربط بقاعدة البيانات')">عرض الطلبات المعلقة</button>
    </div>
</div>

<script>
    async function checkSystemStatus() {
        try {
            const res = await fetch('/api/governance/status');
            const data = await res.json();
            document.getElementById('systemStatus').innerHTML = `
                الحالة: <span style="color: #2ecc71;">${data.systemStatus}</span><br>
                الحماية السيادية: ${data.ipProtection}<br>
                الوقت: ${data.timestamp}
            `;
        } catch (e) {
            document.getElementById('systemStatus').innerText = 'فشل الاتصال بالخادم المركزي.';
        }
    }
    // فحص تلقائي عند الفتح
    checkSystemStatus();
</script>

</body>
</html>
