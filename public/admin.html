<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oxygen11 — مركز التحكم</title><style>
body{font-family:Tahoma,Arial;background:#f3f6f8;margin:0;color:#17202a}.wrap{max-width:1250px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tabs button,.actions button{padding:10px 14px;border:0;border-radius:8px;background:#155eef;color:#fff;cursor:pointer;margin:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{background:#fff;border:1px solid #dfe5eb;border-radius:12px;padding:14px;margin:10px 0}.stat{font-size:26px;font-weight:bold}.muted{color:#667085}.danger{color:#b42318}.unit{display:grid;grid-template-columns:1fr 120px 90px 110px;gap:8px;align-items:center;border-top:1px solid #eee;padding:10px 0}input,select,textarea{padding:9px;border:1px solid #ccd4dd;border-radius:8px;width:100%;box-sizing:border-box}pre{white-space:pre-wrap;background:#101828;color:#fff;padding:12px;border-radius:8px;overflow:auto}</style></head><body><div class="wrap"><div class="top"><div><h1>Oxygen11 — مركز التحكم</h1><p id="me" class="muted"></p></div><div class="tabs"><button onclick="show('orders')">الطلبات</button><button onclick="show('registry')">Registry / الوحدات</button></div></div>
<section id="orders"><div id="stats" class="grid"></div><div id="ordersList">جاري التحميل...</div></section>
<section id="registry" style="display:none"><div class="card"><h2>إنشاء Unit</h2><div class="grid"><input id="uid" placeholder="Unit ID"><input id="ukey" placeholder="Unit Key"><input id="utype" placeholder="Type مثل feature/page"><input id="uname" placeholder="الاسم"></div><button onclick="createUnit()">إنشاء</button></div><div class="card"><h2>Registry</h2><div id="units">جاري التحميل...</div></div></section></div><script>
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function api(url,opt){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطأ');return d}
function show(x){$('orders').style.display=x==='orders'?'block':'none';$('registry').style.display=x==='registry'?'block':'none';if(x==='registry')loadUnits()}
async function load(){try{const me=await api('/api/auth/me');$('me').textContent='المستخدم: '+esc(me.user.uid)+' | الدور: '+esc(me.user.role);const d=await api('/api/orders');const os=d.orders||[];$('stats').innerHTML=[['كل الطلبات',os.length],['قيد التوزيع',os.filter(o=>o.status==='pending_dispatch').length],['قيد التنفيذ',os.filter(o=>o.status==='in_progress').length],['مكتملة',os.filter(o=>o.status==='completed').length]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div>').join('');$('ordersList').innerHTML=os.map(o=>'<div class="card"><b>#'+o.orderId+'</b> — '+esc(o.serviceCategory)+' — '+esc(o.status)+'<br>العميل: '+esc(o.clientName)+'<br><input id="p-'+o.orderId+'" placeholder="UID الفني"><button onclick="assign('+o.orderId+')">إسناد</button> <button onclick="audit('+o.orderId+')">التدقيق</button></div>').join('')||'لا توجد طلبات.'}catch(e){$('ordersList').innerHTML='<p class="danger">'+esc(e.message)+'</p>'}}
async function assign(id){const uid=$('p-'+id).value.trim();if(!uid)return;try{await api('/api/orders/'+id+'/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({providerUid:uid,dispatchType:'manual'})});load()}catch(e){alert(e.message)}}
async function audit(id){try{const d=await api('/api/audit/orders/'+id);alert((d.audit||[]).map(x=>x.at+' — '+x.action+' — '+x.actor).join('\n')||'لا يوجد سجل')}catch(e){alert(e.message)}}
async function loadUnits(){try{const d=await api('/api/registry/units');$('units').innerHTML=(d.units||[]).map(u=>'<div class="unit"><div><b>'+esc(u.displayName)+'</b><br><span class="muted">'+esc(u.unitId)+' | '+esc(u.unitType)+' | '+esc(u.unitKey)+'</span></div><div>v'+u.version+'</div><div>'+esc(u.status)+'</div><button onclick="viewUnit(\''+encodeURIComponent(u.unitId)+'\')">تفاصيل</button></div>').join('')||'لا توجد Units.'}catch(e){$('units').innerHTML='<p class="danger">'+esc(e.message)+'</p>'}}
async function viewUnit(id){try{const d=await api('/api/registry/units/'+decodeURIComponent(id));const u=d.unit;alert(JSON.stringify({identity:{unitId:u.unitId,type:u.unitType,key:u.unitKey,name:u.displayName},version:u.version,status:u.status,permissions:u.permissions,conditions:u.conditions,design:u.design,linking:u.linking,timing:u.timing,scriptRef:u.scriptRef,texts:u.texts,data:u.data,notifications:u.notifications,versions:d.versions},null,2))}catch(e){alert(e.message)}}
async function createUnit(){const body={unitId:$('uid').value.trim(),unitKey:$('ukey').value.trim(),unitType:$('utype').value.trim(),displayName:$('uname').value.trim()};try{await api('/api/registry/units',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('uid').value=$('ukey').value=$('utype').value=$('uname').value='';loadUnits()}catch(e){alert(e.message)}}
load();</script></body></html>
