<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول الآمن | منصة مُتقن</title>
    <!-- استدعاء ملف الهوية البصرية والتصميم -->
    <link rel="stylesheet" href="style.css">
    <!-- استدعاء ملف النقطة السيادية الشفافة تلقائياً -->
    <script src="/sovereign-trigger.js" defer></script>
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(22, 36, 71, 0.1);
            width: 100%;
            max-width: 400px;
            border: 1px solid #e4e9ed;
        }
        h2 {
            color: #162447;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333333;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus {
            border-color: #00b4d8;
            outline: none;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.15);
        }
        button {
            background: linear-gradient(135deg, #0059b3, #162447);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0, 89, 179, 0.2);
            transition: all 0.3s ease;
        }
        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        #msg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول - مُتقن</h2>
        
        <!-- خطوة إدخال رقم الجوال -->
        <div id="step-phone" class="form-group">
            <label for="phone">رقم الجوال:</label>
            <input type="text" id="phone" placeholder="05xxxxxxxx">
            <button onclick="sendOtpRequest()">إرسال رمز التحقق (OTP)</button>
        </div>

        <!-- خطوة إدخال رمز التحقق -->
        <div id="step-otp" class="form-group" style="display: none;">
            <label for="otpCode">أدخل رمز التحقق المرسل:</label>
            <input type="text" id="otpCode" placeholder="xxxx">
            <button onclick="verifyOtpCode()">تحقق والدخول</button>
        </div>
        
        <p id="msg"></p>
    </div>

    <script>
        async function sendOtpRequest() {
            const phone = document.getElementById('phone').value;
            if(!phone) {
                alert('الرجاء إدخال رقم الجوال أولاً');
                return;
            }
            
            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    document.getElementById('step-phone').style.display = 'none';
                    document.getElementById('step-otp').style.display = 'block';
                    const msgEl = document.getElementById('msg');
                    msgEl.style.color = '#0059b3';
                    msgEl.innerText = `تم إرسال الرمز بنجاح. (رمز الاختبار التجريبي: ${data.debugOtp})`;
                } else {
                    const msgEl = document.getElementById('msg');
                    msgEl.style.color = '#e43f5a';
                    msgEl.innerText = data.message || 'حدث خطأ أثناء إرسال الرمز.';
                }
            } catch (err) {
                alert('تعذر الاتصال بالخادم المركزي.');
            }
        }

        async function verifyOtpCode() {
            const phone = document.getElementById('phone').value;
            const otp = document.getElementById('otpCode').value;
            
            if(!otp) {
                alert('الرجاء إدخال رمز التحقق');
                return;
            }

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, otp })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    alert('تم تسجيل الدخول بنجاح وتوثيق الهوية!');
                    window.location.href = '/index.html';
                } else {
                    alert(data.message || 'رمز التحقق غير صحيح.');
                }
            } catch (err) {
                alert('فشل التحقق من الخادم.');
            }
        }
    </script>
</body>
</html>
