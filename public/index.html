<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>مُتقن | البوابة الرئيسية</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- مكتبات فايربيز -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0b1320; color: #1e293b; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .press-scale:active { transform: scale(0.96); }
    
    /* تصميم التبويبات زي ملفك القديم */
    .tab-btn { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #94a3b8; font-weight: 800; font-size: 13px; border-bottom: 2px solid #e2e8f0; transition: 0.3s; }
    .tab-btn.active { color: #006948; border-bottom: 2px solid #006948; }
    
    /* كروت اختيار الدور (عميل / فني) */
    .role-card { border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; background: #f8fafc; }
    .role-card.selected { border-color: #006948; background: #ecfdf5; color: #006948; }
    .role-card .icon { font-size: 28px; margin-bottom: 5px; display: block; }
  </style>
</head>
<body class="min-h-screen flex justify-center items-start p-0 sm:py-4">

  <div class="w-full max-w-[440px] bg-[#F8FAFC] min-h-screen relative shadow-2xl flex flex-col sm:rounded-[36px] overflow-hidden">

    <!-- شريط الرأس للزوار -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm relative z-40">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-emerald-50 border border-emerald-200 text-[#006948] flex items-center justify-center font-black">
          <span class="material-symbols-outlined text-lg">home_repair_service</span>
        </div>
        <div>
          <span class="text-sm font-black text-slate-900 block leading-tight">مُتقن</span>
          <span class="text-[10px] font-bold text-slate-500 block leading-tight">تصفح كزائر</span>
        </div>
      </div>
      <button onclick="openAuthModal()" class="h-9 px-4 rounded-xl bg-[#006948] text-white text-xs font-black flex items-center gap-1.5 press-scale shadow-md">
        <span class="material-symbols-outlined text-sm">login</span>
        <span>دخول / حساب جديد</span>
      </button>
    </header>

    <main class="flex-1 overflow-y-auto no-scrollbar relative z-10 pb-10">
      
      <!-- ================= 1. واجهة الزوار (مفتوحة بدون تسجيل) ================= -->
      <section id="view-visitor" class="p-4 space-y-4">
        <!-- البانر -->
        <div class="rounded-3xl bg-gradient-to-l from-[#006948] to-[#065f46] text-white p-5 shadow-lg">
          <span class="inline-block bg-amber-500 text-slate-950 text-[10px] font-black px-2.5 py-0.5 rounded-full mb-2">عروض التوفير</span>
          <h2 class="text-lg font-black leading-tight">صيانة منزلك بأيدي فنيين معتمدين</h2>
          <p class="text-xs text-emerald-100 mt-1">تصفح خدماتنا واطلب فنيك الآن</p>
          <button onclick="openAuthModal()" class="mt-4 w-full py-2.5 rounded-xl bg-white text-[#006948] font-black text-xs press-scale shadow-sm">
            تسجيل لطلب الخدمة
          </button>
        </div>

        <h3 class="text-sm font-black text-slate-900 px-1">خدمات مُتقن 🛠️</h3>
        <div class="grid grid-cols-2 gap-3">
          <div class="p-4 rounded-3xl bg-white border border-slate-200 shadow-sm text-center">
            <span class="material-symbols-outlined text-4xl text-[#006948] mb-2">mode_fan</span>
            <h3 class="font-black text-xs text-slate-900">صيانة وتكييف</h3>
          </div>
          <div class="p-4 rounded-3xl bg-white border border-slate-200 shadow-sm text-center">
            <span class="material-symbols-outlined text-4xl text-blue-600 mb-2">faucet</span>
            <h3 class="font-black text-xs text-slate-900">سباكة وتسريبات</h3>
          </div>
        </div>
      </section>

      <!-- ================= 2. نافذة التسجيل والدخول (Auth Modal) ================= -->
      <section id="view-auth" class="hidden p-4 space-y-4">
        <div class="flex items-center justify-between mb-2">
          <button onclick="closeAuthModal()" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 press-scale">
            <span class="material-symbols-outlined text-base">close</span>
          </button>
          <span class="text-xs font-black text-[#006948] bg-emerald-50 px-3 py-1 rounded-full">بوابة المصادقة</span>
          <div class="w-9"></div>
        </div>

        <div class="bg-white p-5 rounded-[32px] border border-slate-200 shadow-lg">
          
          <!-- التبويبات (تسجيل دخول / حساب جديد) -->
          <div class="flex mb-5">
            <div id="tab-login" onclick="switchAuthTab('login')" class="tab-btn active">تسجيل دخول</div>
            <div id="tab-register" onclick="switchAuthTab('register')" class="tab-btn">حساب جديد</div>
          </div>

          <!-- اختيار الدور (يظهر في الحالتين) -->
          <div class="mb-5">
            <label class="block text-[11px] font-bold text-slate-500 mb-2 text-center">أنا أستخدم التطبيق كـ :</label>
            <div class="flex gap-3">
              <div id="role-client" onclick="selectRole('client')" class="role-card selected flex-1">
                <span class="material-symbols-outlined icon">person</span>
                <span class="text-xs font-black">عميل</span>
              </div>
              <div id="role-tech" onclick="selectRole('tech')" class="role-card flex-1">
                <span class="material-symbols-outlined icon">engineering</span>
                <span class="text-xs font-black">فني / مقدم خدمة</span>
              </div>
            </div>
            <input type="hidden" id="selected-role" value="client">
          </div>

          <!-- نموذج إدخال الهاتف (خطوة 1) -->
          <div id="step-phone" class="space-y-4">
            <!-- حقل الاسم يظهر فقط في حالة الحساب الجديد -->
            <div id="name-input-container" class="hidden space-y-1.5">
              <label class="block text-[11px] font-bold text-slate-700">الاسم الكامل (إلزامي للجديد):</label>
              <input id="userName" type="text" placeholder="مثال: عبد الله محمد" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold outline-none focus:border-[#006948]"/>
            </div>

            <div class="space-y-1.5">
              <label class="block text-[11px] font-bold text-slate-700">رقم الجوال:</label>
              <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 h-12 focus-within:border-[#006948] transition-colors" dir="ltr">
                <span class="text-xs font-black text-slate-500 border-r border-slate-300 pr-2 mr-2">🇸🇦 +966</span>
                <input id="phoneNumber" type="tel" placeholder="5XXXXXXXX" class="w-full bg-transparent text-sm font-black outline-none text-left tracking-widest text-slate-800"/>
              </div>
            </div>
            
            <button onclick="handleSendOTP()" id="btn-send-otp" class="w-full py-3.5 bg-[#006948] text-white rounded-xl font-black text-xs shadow-md press-scale">
              إرسال كود التحقق (OTP)
            </button>

            <!-- حاوية ريكابتشا ظاهرة عشان ما تضربش (ممكن نصغرها بالـ CSS بس لازم تكون موجودة في الـ DOM ومفتوحة) -->
            <div class="flex justify-center mt-2">
              <div id="recaptcha-container"></div>
            </div>
          </div>

          <!-- نموذج إدخال الـ OTP (خطوة 2) -->
          <div id="step-verify" class="hidden space-y-4 text-center">
            <p class="text-[11px] font-bold text-emerald-600 bg-emerald-50 py-1.5 rounded-lg border border-emerald-100">تم إرسال كود لجوّالك</p>
            
            <div class="space-y-1.5">
              <label class="block text-[11px] font-bold text-slate-700">أدخل الكود (6 أرقام):</label>
              <input id="otpCode" type="tel" maxlength="6" placeholder="••••••" class="w-full bg-slate-50 border border-slate-300 rounded-2xl py-3.5 text-center text-2xl font-mono font-black tracking-[0.5em] outline-none focus:border-[#006948] text-[#006948]"/>
            </div>
            
            <button onclick="handleVerifyOTP()" id="btn-verify-otp" class="w-full py-3.5 bg-[#006948] text-white rounded-xl font-black text-xs shadow-md press-scale">
              تأكيد الدخول
            </button>
            <button onclick="backToPhone()" class="text-[10px] text-slate-500 font-bold underline mt-2">تعديل رقم الجوال</button>
          </div>

        </div>
      </section>
      
    </main>
    
    <!-- رسائل النظام -->
    <div id="statusMessage" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] max-w-[380px] hidden p-3 rounded-2xl text-xs font-black text-center shadow-2xl z-50 transition-all"></div>
  </div>

  <script>
    // 1. إعدادات فايربيز (مشروع mutqn-opt)
    const firebaseConfig = {
      apiKey: "AIzaSyCJnFR_cALYeWvPHroEqdCHbnhlcREdjPI",
      authDomain: "mutqn-opt.firebaseapp.com",
      projectId: "mutqn-opt",
      storageBucket: "mutqn-opt.firebasestorage.app",
      messagingSenderId: "290720043173",
      appId: "1:290720043173:web:72167db99e1b801e31fd4c"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    let authMode = 'login'; // 'login' or 'register'

    // تهيئة الـ reCAPTCHA بشكل آمن لمنع الـ Crash
    function initRecaptcha() {
      if (window.recaptchaVerifier) {
        window.recaptchaVerifier.clear(); // تنظيف القديم لو موجود
      }
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'normal', // هنخليها normal مؤقتاً عشان لو فايربيز طلب يظهر الصورة يظهرها للمستخدم بدل ما يعلق
        'callback': (response) => { console.log('reCAPTCHA solved'); }
      });
      window.recaptchaVerifier.render();
    }

    // التنقل بين الزائر والتسجيل
    function openAuthModal() {
      document.getElementById('view-visitor').classList.add('hidden');
      document.getElementById('view-auth').classList.remove('hidden');
      initRecaptcha(); // تجهيز الكابتشا أول ما الواجهة تفتح
    }
    
    function closeAuthModal() {
      document.getElementById('view-auth').classList.add('hidden');
      document.getElementById('view-visitor').classList.remove('hidden');
    }

    // التبديل بين الدخول وحساب جديد
    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById('tab-login').classList.remove('active');
      document.getElementById('tab-register').classList.remove('active');
      document.getElementById('tab-' + mode).classList.add('active');

      // إظهار حقل الاسم لو حساب جديد
      if (mode === 'register') {
        document.getElementById('name-input-container').classList.remove('hidden');
      } else {
        document.getElementById('name-input-container').classList.add('hidden');
      }
    }

    // اختيار عميل أو فني
    function selectRole(role) {
      document.getElementById('role-client').classList.remove('selected');
      document.getElementById('role-tech').classList.remove('selected');
      document.getElementById('role-' + role).classList.add('selected');
      document.getElementById('selected-role').value = role;
    }

    function showMessage(text, isError = false) {
      const msgDiv = document.getElementById('statusMessage');
      msgDiv.className = `fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] max-w-[380px] p-3 rounded-2xl text-xs font-black text-center shadow-2xl z-50 ${isError ? 'bg-red-600 text-white border border-red-700' : 'bg-[#006948] text-white'}`;
      msgDiv.innerText = text;
      msgDiv.classList.remove('hidden');
      setTimeout(() => msgDiv.classList.add('hidden'), 5000);
    }

    function backToPhone() {
      document.getElementById('step-verify').classList.add('hidden');
      document.getElementById('step-phone').classList.remove('hidden');
      initRecaptcha(); // إعادة التهيئة
    }

    // ================= إرسال الـ OTP =================
    function handleSendOTP() {
      let rawPhone = document.getElementById('phoneNumber').value.trim();
      let name = document.getElementById('userName').value.trim();

      if (!rawPhone || rawPhone.length < 8) {
        return showMessage("الرجاء إدخال رقم جوال صحيح", true);
      }

      if (authMode === 'register' && !name) {
        return showMessage("الرجاء إدخال اسمك لإنشاء الحساب", true);
      }

      // إضافة مفتاح الدولة تلقائياً إذا لم يكتبه
      let phone = rawPhone.startsWith('+') ? rawPhone : '+966' + (rawPhone.startsWith('0') ? rawPhone.substring(1) : rawPhone);

      const btn = document.getElementById('btn-send-otp');
      btn.disabled = true;
      btn.innerText = "جاري الإرسال...";

      firebase.auth().signInWithPhoneNumber(phone, window.recaptchaVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          document.getElementById('step-phone').classList.add('hidden');
          document.getElementById('step-verify').classList.remove('hidden');
          showMessage("تم إرسال كود التحقق بنجاح ✓", false);
        }).catch((error) => {
          console.error("Firebase Error:", error);
          let errorMsg = "حدث خطأ غير معروف.";
          if(error.code === 'auth/invalid-phone-number') errorMsg = "رقم الجوال غير صحيح أو غير مدعوم.";
          if(error.code === 'auth/unauthorized-domain') errorMsg = "هذا النطاق غير مصرح له في إعدادات فايربيز (يجب إضافة دومين الموقع في Firebase Console).";
          
          showMessage("فشل الإرسال: " + errorMsg, true);
          btn.disabled = false;
          btn.innerText = "إرسال كود التحقق (OTP)";
          initRecaptcha(); // إعادة المحاولة
        });
    }

    // ================= تأكيد الكود والتوجيه =================
    function handleVerifyOTP() {
      const code = document.getElementById('otpCode').value.trim();
      if (code.length < 6) return showMessage("الرجاء إدخال الكود المكون من 6 أرقام", true);

      const btn = document.getElementById('btn-verify-otp');
      btn.disabled = true;
      btn.innerText = "جاري التحقق...";

      window.confirmationResult.confirm(code)
        .then((result) => {
          const user = result.user;
          const role = document.getElementById('selected-role').value;
          const name = document.getElementById('userName').value.trim();
          
          // تشفير الجلسة
          const userData = { phone: user.phoneNumber, role: role, name: name || "عميل مُتقن", uid: user.uid };
          const token = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(userData)))));
          
          // التوجيه: إذا اختار "فني" يروح لفرع الفني، وإذا "عميل" يروح لفرع العميل
          const targetDomain = role === 'tech' ? 'https://technician.oxygen11.com' : 'https://client.oxygen11.com';
          
          showMessage("تم التحقق بنجاح! جاري التوجيه...", false);
          setTimeout(() => window.location.replace(`${targetDomain}/?auth_token=${token}`), 1500);

        }).catch((error) => {
          showMessage("الكود المدخل غير صحيح، حاول مرة أخرى", true);
          btn.disabled = false;
          btn.innerText = "تأكيد الدخول";
        });
    }
  </script>
</body>
</html>
