<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تطبيق مُتقن</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 320px; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 20px; font-size: 1.4rem; }
        input[type="password"] { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 1.2rem; box-sizing: border-box; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>بوابة تسجيل الدخول</h1>
        <input type="password" id="passInput" placeholder="أدخل رقم الصلاحية (1 إلى 4)" autofocus>
        <button onclick="routeUser()">دخول النظام</button>
    </div>

    <script>
        function routeUser() {
            const val = document.getElementById('passInput').value.trim();
            if (val === '1') {
                window.location.href = 'client/index.html';
            } else if (val === '2') {
                window.location.href = 'admin/index.html';
            } else if (val === '3') {
                window.location.href = 'owner/index.html';
            } else if (val === '4') {
                window.location.href = 'channel/index.html';
            } else {
                alert('رمز الدخول غير صحيح! الرجاء إدخال رقم من 1 إلى 4.');
            }
        }
    </script>
</body>
</html>
