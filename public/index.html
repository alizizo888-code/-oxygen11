<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title id="mucs-page-title">مُتقن | جاري التحميل...</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- مكتبات فايربيز -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- ملفات محرك MUCS الأساسية -->
  <script src="public/mucs-core.js"></script>
  <script src="public/auth-gateway.js"></script>

  <style>
    :root {
      --mucs-primary: #006948;
      --mucs-primary-hover: #00553a;
      --mucs-bg: #0b1320;
    }
    body { font-family: 'Cairo', sans-serif; background-color: var(--mucs-bg); user-select: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .press-scale:active { transform: scale(0.96); transition: 0.1s; }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex justify-center items-start p-0 sm:py-4">

  <div class="w-full max-w-[440px] bg-[#F8FAFC] min-h-screen relative shadow-2xl flex flex-col sm:rounded-[36px] overflow-hidden">
    
    <!-- 1. حاوية الشريط العلوي -->
    <header id="mucs-header-container" class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm relative z-40"></header>

    <main class="flex-1 overflow-y-auto no-scrollbar relative z-10 pb-10">
      
      <!-- 2. حاوية واجهة الزوار (الخدمات والعروض) -->
      <section id="view-visitor" class="p-4 space-y-4 fade-in">
        <div id="mucs-hero-container"></div>
        <div id="mucs-services-container" class="grid grid-cols-2 gap-3 mt-4"></div>
      </section>

      <!-- 3. حاوية بوابة المصادقة (OTP أو غيره) -->
      <section id="view-auth" class="hidden p-4 space-y-4 fade-in">
        <div class="flex items-center justify-between mb-2">
          <button onclick="MUCS_Core.switchView('visitor')" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 press-scale">
            <span class="material-symbols-outlined text-base">arrow_forward</span>
          </button>
          <span class="text-xs font-black text-[var(--mucs-primary)] bg-emerald-50 px-3 py-1 rounded-full">بوابة المصادقة</span>
          <div class="w-9"></div>
        </div>

        <div id="mucs-auth-container" class="bg-white p-5 rounded-[32px] border border-slate-200 shadow-lg">
           <!-- يُحقن نموذج التسجيل هنا بناءً على إعدادات المالك (OTP, Password, Biometric) -->
        </div>
      </section>
      
    </main>
    
    <div id="mucs-toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] max-w-[380px] hidden p-3 rounded-2xl text-xs font-black text-center shadow-2xl z-50 transition-all"></div>
  </div>

  <script>
    // تشغيل المحرك فور تحميل الهيكل
    window.addEventListener('DOMContentLoaded', () => {
      MUCS_Core.initialize();
    });
  </script>
</body>
</html>
