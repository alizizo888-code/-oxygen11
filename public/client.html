<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة العميل - مؤسسة أكسجين</title>
  <style>
    body { font-family: Tahoma, sans-serif; background:#f4f7f6; margin:0; padding:20px; }
    .container { max-width:800px; margin:auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
    h1 { color:#0056b3; margin-top:0; }
    label { display:block; margin-top:14px; font-weight:700; }
    input, select, textarea { width:100%; box-sizing:border-box; padding:11px; margin-top:6px; border:1px solid #ddd; border-radius:8px; font:inherit; }
    button { margin-top:18px; padding:12px 20px; border:0; border-radius:8px; background:#0056b3; color:#fff; cursor:pointer; font:inherit; }
    #result { margin-top:18px; padding:12px; border-radius:8px; background:#eef7ee; display:none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>طلب صيانة جديد</h1>
    <p>أرسل بيانات الطلب، وسيظهر رقم الطلب فور إنشائه.</p>

    <form id="orderForm">
      <label>اسم العميل<input name="clientName" required></label>
      <label>رقم الجوال<input name="phone" inputmode="tel" required></label>
      <label>نوع الخدمة
        <select name="serviceCategory" required>
          <option value="">اختر الخدمة</option>
          <option>صيانة مكيف سبليت</option>
          <option>صيانة تكييف مركزي</option>
          <option>صيانة مكيف مخفي</option>
          <option>غرف تبريد وفريزر</option>
          <option>صيانة عامة</option>
        </select>
      </label>
      <label>الأولوية
        <select name="priority">
          <option value="normal">عادية</option>
          <option value="high">عاجلة</option>
          <option value="critical">طارئة</option>
        </select>
      </label>
      <label>الموقع / رابط خرائط Google<input name="location" placeholder="ضع رابط الموقع" required></label>
      <label>تفاصيل الطلب<textarea name="notes" rows="4" placeholder="وصف العطل أو المطلوب"></textarea></label>
      <button type="submit">إرسال طلب الصيانة</button>
    </form>

    <div id="result"></div>
    <h2 style="margin-top:28px;">طلباتي</h2>
    <div id="orders"></div>
  </div>

  <script>
    const form = document.getElementById("orderForm");
    const result = document.getElementById("result");
    const ordersBox = document.getElementById("orders");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.style.display = "block";
      result.textContent = "جاري إرسال الطلب...";
      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const response = await fetch("/api/orders", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(data)
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "تعذر إنشاء الطلب");
        result.textContent = "تم إنشاء الطلب رقم " + payload.order.orderId + " وحالته: قيد التوزيع.";
        form.reset();
        loadOrders();
      } catch (error) {
        result.textContent = error.message;
        result.style.background = "#fff0f0";
      }
    });

    async function loadOrders() {
      const response = await fetch("/api/orders");
      const payload = await response.json();
      if (!response.ok) {
        ordersBox.innerHTML = '<p style="color:#b91c1c">يجب تسجيل الدخول من البوابة الرئيسية أولاً.</p>';
        return;
      }

      ordersBox.innerHTML = (payload.orders || []).map(order => {
        const payButton = order.status === "awaiting_payment"
          ? '<button onclick="payOrder(' + order.orderId + ')" style="background:#059669;color:#fff;border:0;border-radius:8px;padding:9px 12px;">سداد الفاتورة</button>'
          : '';
        const total = order.pricing?.total || 0;
        return '<div style="border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0;background:#fff">' +
          '<b>طلب #' + order.orderId + '</b><br>' +
          'الخدمة: ' + escapeHtml(order.serviceCategory) + '<br>' +
          'الحالة: <b>' + escapeHtml(order.status) + '</b><br>' +
          (order.invoice ? 'الإجمالي: ' + total + ' ر.س<br>' : '') +
          payButton + '</div>';
      }).join("") || "<p>لا توجد طلبات.</p>";
    }

    async function payOrder(orderId) {
      const method = prompt("طريقة السداد: online_mada_visa / stc_pay / wallet / cash", "online_mada_visa");
      if (!method) return;
      const response = await fetch("/api/orders/" + orderId + "/payment", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({method})
      });
      const payload = await response.json();
      if (!response.ok) return alert(payload.error || "تعذر السداد");
      alert("تم تسجيل السداد بنجاح.");
      loadOrders();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    loadOrders();
  </script>
</body>
</html>
