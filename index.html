<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة المشرف الميداني | مُتقن</title>
  <script src="./motqan-global-header.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://www.oxygen11.com/oxygen_core/oxygen-theme.css"/>
</head>
<body class="min-h-screen flex justify-center items-start p-0 sm:py-6">
  <div class="w-full max-w-4xl bg-[#F8FAFC] min-h-screen rounded-3xl p-5 space-y-4 shadow-xl border border-slate-200">
    <header class="flex items-center justify-between border-b pb-3 bg-white p-4 rounded-2xl">
      <div>
        <h1 class="font-black text-sm text-slate-900">لوحة تحكم المشرف الميداني</h1>
        <p class="text-[10px] text-[#006948] font-bold">admin.oxygen11.com • متابعة وتوزيع المهام</p>
      </div>
      <button onclick="window.location.replace('https://www.oxygen11.com')" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold">خروج</button>
    </header>

    <div class="grid grid-cols-3 gap-3 text-center">
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
        <span class="text-[10px] text-slate-400 font-bold block">الطلبات الواردة</span>
        <span class="text-xl font-black text-slate-900 mt-1 block">18</span>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
        <span class="text-[10px] text-[#006948] font-bold block">الفنيون بالميدان</span>
        <span class="text-xl font-black text-[#006948] mt-1 block">12</span>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
        <span class="text-[10px] text-amber-600 font-bold block">بانتظار الاعتماد</span>
        <span class="text-xl font-black text-amber-600 mt-1 block">3</span>
      </div>
    </div>

    <!-- جدول الطلبات السريع -->
    <div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3">
      <h3 class="text-xs font-black text-slate-800">توزيع المهام اللحظي</h3>
      <div class="p-3 bg-slate-50 rounded-xl flex items-center justify-between text-xs">
        <div>
          <span class="font-bold text-slate-900">طلب غسيل مكيف سبليت #9021</span>
          <p class="text-[10px] text-slate-500">حي الملقا • العميل: محمد عبد الله</p>
        </div>
        <button onclick="alert('تم إسناد الطلب للفني الأقرب')" class="px-3 py-1.5 bg-[#006948] text-white rounded-lg text-[10px] font-bold">تعيين فني</button>
      </div>
    </div>
  </div>
</body>
</html>
