<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة المالك السيادية | مُتقن</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    (function checkOwner() {
      const pin = prompt('أدخل الرمز السري للمالك (علي: 789512364):');
      if (pin !== '789512364') {
        alert('غير مصرح لك بالدخول!');
        window.location.replace('https://client.oxygen11.com');
      }
    })();
  </script>
</head>
<body class="min-h-screen bg-[#070d18] flex justify-center items-start p-0 sm:py-6 text-white font-['Cairo']">
  <div class="w-full max-w-4xl bg-slate-900 rounded-3xl p-5 space-y-4 shadow-2xl border border-amber-500/30">
    <header class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 bg-amber-500/20 text-amber-400 rounded-xl flex items-center justify-center font-black text-xl border border-amber-500/30">👑</div>
        <div>
          <h1 class="font-black text-sm">لوحة تحكم المالك (علي)</h1>
          <p class="text-[10px] text-amber-400">owner.oxygen11.com • صلاحيات سيادية كاملة</p>
        </div>
      </div>
      <button onclick="window.location.replace('https://client.oxygen11.com')" class="px-3 py-1.5 bg-red-500/20 text-red-400 rounded-xl text-xs font-bold border border-red-500/30">
        قفل الجلسة
      </button>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <span class="text-xs text-slate-400 font-bold block">إيقاف استقبال الطلبات</span>
        <button onclick="alert('تم تجميد المنظومة كلياً')" class="mt-2 w-full py-2 bg-red-600 text-white font-bold text-xs rounded-xl">
          إيقاف الطوارئ كلياً
        </button>
      </div>
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
        <span class="text-xs text-slate-400 font-bold block">الانتقال لفرع المشرفين</span>
        <button onclick="window.location.replace('https://admin.oxygen11.com')" class="mt-2 w-full py-2 bg-[#006948] text-white font-bold text-xs rounded-xl">
          فتح لوحة المشرف admin
        </button>
      </div>
    </div>
  </div>
</body>
</html>
