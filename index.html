<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُتقن - البوابة الرئيسية للخدمات</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; margin: auto; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #e2e8f0; }
        .header h1 { color: #0f172a; font-size: 1.5rem; margin-bottom: 5px; }
        .header p { color: #64748b; font-size: 0.9rem; }
        .content { padding: 20px 0; flex-grow: 1; }
        .service-card { background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .service-card h3 { color: #0284c7; margin-bottom: 8px; font-size: 1.1rem; }
        .service-card p { color: #475569; font-size: 0.85rem; }
        .footer-actions { padding: 15px 0; text-align: center; border-top: 1px solid #e2e8f0; }
        input, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 1rem; }
        button { background-color: #0284c7; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        .secondary-btn { background-color: #f1f5f9; color: #475569; }
        .secondary-btn:hover { background-color: #e2e8f0; }
    </style>
</head>
<body>

    <div id="app" class="container">
        <!-- المحتوى الافتراضي لواجهة الزوار -->
        <div>
            <div class="header">
                <h1>مؤسسة أكسجين / مُتقن</h1>
                <p>بوابة صيانة وخدمات التكييف والتبريد الشاملة</p>
            </div>
            <div class="content">
                <div class="service-card">
                    <h3>خدمات الصيانة والتركيب</h3>
                    <p>نقدم خدمات متكاملة لصيانة المكيفات المركزية والاسبلت وغرف التبريد بجودة عالية.</p>
                </div>
                <div class="service-card">
                    <h3>معرفة ودعم فني</h3>
                    <p>استكشف أحدث التقنيات والحلول الهندسية المعتمدة في إدارة ورش الصيانة.</p>
                </div>
            </div>
        </div>
        
        <div class="footer-actions">
            <button onclick="showLoginScreen()">تسجيل الدخول / لوحة التحكم</button>
        </div>
    </div>

    <script>
        // التحقق التلقائي إذا كان المستخدم مسجل مسبقاً وتوجيهه لنطاقه المخصص
        window.onload = function() {
            const activeUser = localStorage.getItem('activeUser');
            if (activeUser) {
                try {
                    const user = JSON.parse(activeUser);
                    redirectToRoleDomain(user.role);
                } catch (e) {
                    // البقاء في واجهة الزوار إذا حدث خطأ في البيانات المخزنة
                }
            }
        };

        function showLoginScreen() {
            document.getElementById('app').innerHTML = `
                <div>
                    <div class="header">
                        <h1>تسجيل الدخول</h1>
                        <p>أدخل بيانات الحساب للمتابعة</p>
                    </div>
                    <div class="content" style="margin-top: 20px;">
                        <input type="text" id="userInput" placeholder="رقم الهاتف أو الاسم">
                        <input type="password" id="passInput" placeholder="الرقم السري">
                        <button onclick="handleLogin()">دخول</button>
                        <button class="secondary-btn" onclick="showRegisterScreen()">إنشاء حساب جديد</button>
                    </div>
                </div>
                <div class="footer-actions">
                    <button class="secondary-btn" onclick="location.reload()">العودة للرئيسية</button>
                </div>
            `;
        }

        function showRegisterScreen() {
            document.getElementById('app').innerHTML = `
                <div>
                    <div class="header">
                        <h1>حساب جديد</h1>
                        <p>انضم إلى منصة مُتقن</p>
                    </div>
                    <div class="content" style="margin-top: 10px;">
                        <input type="text" id="regName" placeholder="الاسم">
                        <input type="text" id="regPhone" placeholder="رقم الهاتف">
                        <input type="password" id="regPassword" placeholder="الرقم السري">
                        <select id="regRole" style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 8px;">
                            <option value="client">عميل</option>
                            <option value="technician">فني</option>
                            <option value="owner">المدير (أونر)</option>
                            <option value="admin">شركة / أدمن</option>
                        </select>
                        <button onclick="handleRegister()">تسجيل الحساب</button>
                    </div>
                </div>
                <div class="footer-actions">
                    <button class="secondary-btn" onclick="showLoginScreen()">لدي حساب بالفعل</button>
                </div>
            `;
        }

        function handleLogin() {
            const input = document.getElementById('userInput').value;
            const password = document.getElementById('passInput').value;

            const users = JSON.parse(localStorage.getItem('systemUsers')) || [];
            const user = users.find(u => (u.phone === input || u.name === input) && u.password === password);

            if (user) {
                localStorage.setItem('activeUser', JSON.stringify(user));
                redirectToRoleDomain(user.role);
            } else {
                alert('بيانات الدخول غير صحيحة.');
            }
        }

        function handleRegister() {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;

            if (!name || !phone || !password) {
                alert('الرجاء تعبئة جميع الحقول.');
                return;
            }

            let users = JSON.parse(localStorage.getItem('systemUsers')) || [];
            users.push({ name, phone, password, role });
            localStorage.setItem('systemUsers', JSON.stringify(users));
            alert('تم إنشاء الحساب بنجاح!');
            showLoginScreen();
        }

        function redirectToRoleDomain(role) {
            const domains = {
                'client': 'https://client.oxygen11.com',
                'admin': 'https://admin.oxygen11.com',
                'owner': 'https://owner.oxygen11.com',
                'technician': 'https://technician.oxygen11.com'
            };

            if (domains[role]) {
                window.location.href = domains[role];
            }
        }
    </script>
</body>
</html>
