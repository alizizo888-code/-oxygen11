<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>بوابة الفنيين الميدانية | مُتقن</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://www.oxygen11.com/oxygen_core/oxygen-theme.css"/>

  <script>
    (function checkTech() {
      const token = new URLSearchParams(window.location.search).get('auth_token');
      if (token) {
        try {
          const raw = decodeURIComponent(escape(atob(decodeURIComponent(token))));
          localStorage.setItem('motqan_tech_session', raw);
          window.history.replaceState({}, document.title, window.location.pathname);
        } catch(e) {}
      }
      const s = JSON.parse(localStorage.getItem('motqan_tech_session') || '{}');
      if (!s.phone && !token) window.location.replace('https://www.oxygen11.com');
    })();
  </script>
</head>
<body class="min-h-screen flex justify-center items-start p-0 sm:py-4">
  <div class="w-full max-w-[440px] bg-[#F8FAFC] min-h-screen relative shadow-2xl flex flex-col sm:rounded-[36px] overflow-hidden p-4 space-y-4">
    
    <!-- Header -->
    <header class="bg-white border border-slate-200 p-3 rounded-2xl flex items-center justify-between shadow-2xs">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-emerald-50 text-[#006948] flex items-center justify-center font-bold">
          <span class="material-symbols-outlined">handyman</span>
        </div>
        <div>
          <h1 id="tech-name" class="font-black text-xs text-slate-900">الفني: ريان العمري</h1>
          <p class="text-[9px] text-[#006948] font-bold">حالة الميدان: متصل ومتاح ⚡</p>
        </div>
      </div>
      <button onclick="localStorage.removeItem('motqan_tech_session'); window.location.replace('https://www.oxygen11.com');" class="w-8 h-8 rounded-xl bg-red-50 text-red-600 flex items-center justify-center press-scale">
        <span class="material-symbols-outlined text-sm">logout</span>
      </button>
    </header>

    <!-- مهام الميدان -->
    <div class="bg-gradient-to-r from-[#006948] to-[#047857] text-white p-4 rounded-3xl shadow-sm">
      <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold">المهام الجارية</span>
      <h2 class="text-base font-black mt-1">المهام الميدانية المسندة إليك</h2>
      <p class="text-[11px] text-emerald-100">نطاق التغطية الميدانية: مكة المكرمة وجدة</p>
    </div>

    <!-- بطاقة المهمة -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs space-y-3">
      <div class="flex items-center justify-between">
        <span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-black">مهمة جديدة</span>
        <span class="font-mono text-xs font-bold text-slate-500">#8341</span>
      </div>
      <div>
        <h3 class="font-black text-xs text-slate-900">كشف تسريب سباكة إلكتروني بالنيتروجين</h3>
        <p class="text-[10px] text-slate-500 mt-0.5">العميل: عبد العزيز السالم • حي الروضة - شارع الأمل</p>
      </div>
      <div class="flex items-center justify-between text-xs pt-1 border-t">
        <span class="text-slate-500">قيمة الفاتورة:</span>
        <span class="font-black text-[#006948] text-sm">180.00 ر.س</span>
      </div>
      <div class="flex gap-2">
        <button onclick="alert('تم قبول المهمة وبدء التحرك للعميل!')" class="flex-1 py-2.5 bg-[#006948] text-white text-xs font-black rounded-xl press-scale">بدء التوجه للعميل 🚗</button>
        <a href="https://maps.google.com" target="_blank" class="px-3 py-2.5 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl flex items-center justify-center press-scale">الخريطة</a>
      </div>
    </div>

  </div>
</body>
</html>
