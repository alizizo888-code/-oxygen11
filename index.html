<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>بوابة الفنيين الميدانية | مُتقن</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    (function initTech() {
      const token = new URLSearchParams(window.location.search).get('auth_token');
      if (token) {
        try {
          const raw = decodeURIComponent(escape(atob(decodeURIComponent(token))));
          localStorage.setItem('motqan_tech_session', raw);
          window.history.replaceState({}, document.title, window.location.pathname);
        } catch(e) {}
      }
      const s = JSON.parse(localStorage.getItem('motqan_tech_session') || '{}');
      if (!s.phone && !token) {
        // التحويل إلى صفحة متقن الأساسية بالفرع
        window.location.replace('https://client.oxygen11.com');
      }
    })();
  </script>
</head>
<body class="min-h-screen bg-[#0b1320] flex justify-center items-start p-0 sm:py-6">
  <div class="w-full max-w-[440px] bg-[#F8FAFC] min-h-screen relative shadow-2xl flex flex-col sm:rounded-[36px] overflow-hidden p-4 space-y-4">
    
    <header class="flex items-center justify-between border-b pb-3 bg-white p-3 rounded-2xl shadow-2xs">
      <div>
        <h1 id="tech-name" class="font-bold text-xs text-slate-900">بوابة الفني الميداني</h1>
        <p class="text-[9px] text-blue-600 font-bold">technician.oxygen11.com</p>
      </div>
      <button onclick="logoutTech()" class="px-2.5 py-1.5 bg-red-50 text-red-600 text-xs font-bold rounded-xl flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">logout</span>
        <span>خروج</span>
      </button>
    </header>

    <div class="bg-blue-600 text-white p-4 rounded-2xl shadow-md">
      <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold">الحالة: متصل بالميدان ⚡</span>
      <h2 class="text-base font-black mt-2">المهام الميدانية الواردة</h2>
      <p class="text-xs text-blue-100">مكة المكرمة وجدة</p>
    </div>

    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-slate-800">غسيل مكيف سبليت (جهازين)</span>
        <span class="text-xs font-black text-emerald-700 font-mono">230.0 ر.س</span>
      </div>
      <p class="text-[11px] text-slate-500">حي الروضة • العميل: محمد عبد الله</p>
      <button onclick="alert('تم قبول المهمة والبدء بالتحرك!')" class="w-full py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl">
        قبول المهمة والتحرك 🚗
      </button>
    </div>

  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('motqan_tech_session') || '{}');
    if (user.name) document.getElementById('tech-name').textContent = `الفني: ${user.name}`;

    function logoutTech() {
      localStorage.removeItem('motqan_tech_session');
      window.location.replace('https://client.oxygen11.com');
    }
  </script>
</body>
</html>
