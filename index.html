<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة المشرف الميداني | مُتقن</title>

</head>
<body class="min-h-screen bg-[#0b1320] flex justify-center items-start p-0 sm:py-6 text-slate-800">
  <div class="w-full max-w-4xl bg-[#F8FAFC] min-h-screen rounded-3xl p-5 space-y-4 shadow-xl border border-slate-200">

        <p class="text-[10px] text-[#006948] font-bold">admin.oxygen11.com</p>

        خروج لصفحة متقن

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-center">
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
        <span class="text-[10px] text-slate-400 font-bold block">طلبات قيد التوزيع</span>
        <span class="text-xl font-black text-slate-900 mt-1 block">5</span>

        <span class="text-[10px] text-[#006948] font-bold block">الفنيون النشطون</span>
        <span class="text-xl font-black text-[#006948] mt-1 block">14</span>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 col-span-2 sm:col-span-1">
        <span class="text-[10px] text-amber-600 font-bold block">المشرف المسؤول</span>
        <span class="text-xs font-black text-slate-800 mt-1 block">ميدان مكة وجدة</span>
      </div>
    </div>
  </div>
</body>
</html>
