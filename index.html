<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>بوابة الفني الميداني | مُتقن</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --mucs-primary: #006948;
      --mucs-primary-hover: #00553a;
      --mucs-bg: #0b1320;
    }
    body { font-family: 'Cairo', sans-serif; background-color: var(--mucs-bg); color: #1e293b; user-select: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .press-scale:active { transform: scale(0.96); transition: 0.1s; }
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- فك التوكن الخاص بالفني عند الإقلاع -->
  <script>
    (function initTechSession() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('auth_token');
      if (token) {
        try {
          const raw = decodeURIComponent(escape(atob(decodeURIComponent(token))));
          localStorage.setItem('motqan_tech_session', raw);
          window.history.replaceState({}, document.title, window.location.pathname);
        } catch(e) { console.error("Tech Token Error:", e); }
      }
    })();
  </script>
</head>
<body class="min-h-screen flex justify-center items-start p-0 sm:py-4">

  <div class="w-full max-w-[440px] bg-[#F8FAFC] min-h-screen relative shadow-2xl flex flex-col sm:rounded-[36px] overflow-hidden pb-20">

    <!-- رأس لوحة الفني -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-40 flex items-center justify-between shadow-2xs">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-blue-50 border border-blue-200 text-blue-700 flex items-center justify-center font-black">
          <span class="material-symbols-outlined text-lg">engineering</span>
        </div>
        <div>
          <span id="tech-header-name" class="text-xs font-black text-slate-900 block leading-tight">فني ميداني معتمد</span>
          <span class="text-[9px] font-bold text-emerald-600 block leading-tight flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> متصل بالرادار المركزي
          </span>
        </div>
      </div>

      <button onclick="executeTechLogout()" class="h-8 px-3 rounded-xl bg-red-50 border border-red-200 text-red-600 text-xs font-black flex items-center gap-1 press-scale">
        <span class="material-symbols-outlined text-sm">logout</span>
        <span>خروج</span>
      </button>
    </header>

    <!-- المحتوى الميداني -->
    <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4">

      <!-- حالة الرادار الميداني (تشغيل / إيقاف استقبال الطلبات) -->
      <div class="bg-gradient-to-l from-slate-900 to-slate-800 text-white p-4 rounded-3xl shadow-md flex items-center justify-between">
        <div>
          <span class="text-[10px] text-slate-400 font-bold block">حالة الاستقبال الميداني</span>
          <h2 id="radar-status-label" class="text-sm font-black text-emerald-400">الرادار نشط (يستقبل طلبات)</h2>
        </div>
        <button onclick="toggleTechRadar()" id="radar-toggle-btn" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-xs rounded-xl press-scale shadow-sm transition">
          إيقاف مؤقت
        </button>
      </div>

      <!-- قائمة الطلبات المتاحة في الميدان -->
      <div class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <h3 class="text-xs font-black text-slate-900">الطلبات المتاحة في نطاقك ⚡</h3>
          <span class="text-[10px] text-slate-400 font-bold">تحديث تلقائي</span>
        </div>

        <div id="tech-orders-container" class="space-y-2.5">
          <!-- طلب تجريبي وارد من النظام المركزي -->
          <div class="p-4 rounded-2xl bg-white border border-slate-200 shadow-2xs space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-black">بانتظار القبول</span>
              <span class="text-[10px] font-bold text-slate-400 font-mono">قبل دقيقتين</span>
            </div>
            <div>
              <h4 class="font-black text-xs text-slate-900">غسيل مكيف سبليت (عدد 3 أجهزة)</h4>
              <p class="text-[11px] text-slate-600 mt-0.5">📍 الموقع: مكة المكرمة - حي العزيزية</p>
              <p class="text-[11px] text-emerald-700 font-bold mt-1">💰 العائد المتوقع: 185 ر.س</p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
              <button onclick="acceptOrder('ORD-984210')" class="py-2.5 bg-[#006948] hover:bg-[#00553a] text-white rounded-xl font-black text-xs press-scale shadow-sm transition">
                قبول الطلب
              </button>
              <button onclick="rejectOrder('ORD-984210')" class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-black text-xs press-scale transition">
                اعتذار
              </button>
            </div>
          </div>
        </div>
      </div>

    </main>

    <!-- شريط التنقل السفلي للفني -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-[440px] mx-auto bg-white/95 border-t border-slate-200 px-2 py-2 z-40 flex items-center justify-around text-[10px]">
      <button class="flex flex-col items-center text-[var(--mucs-primary)] font-black">
        <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">radar</span>
        <span>الرادار</span>
      </button>
      <button class="flex flex-col items-center text-slate-500 font-bold">
        <span class="material-symbols-outlined text-xl">task_alt</span>
        <span>مهامي</span>
      </button>
      <button class="flex flex-col items-center text-slate-500 font-bold">
        <span class="material-symbols-outlined text-xl">payments</span>
        <span>الأرباح</span>
      </button>
    </nav>

  </div>

  <script>
    let techSession = {};
    let isRadarActive = true;

    window.addEventListener('DOMContentLoaded', () => {
      loadTechSession();
      initTechStealthGPS();
    });

    function loadTechSession() {
      try {
        techSession = JSON.parse(localStorage.getItem('motqan_tech_session') || '{}');
        if (techSession.name) {
          document.getElementById('tech-header-name').textContent = techSession.name;
        }
      } catch(e) { console.error(e); }
    }

    // تتبع موقع الفني سرياً لرفعه إلى لوحة المشرف والمالك (صلاحيات إدارية جبارة)
    function initTechStealthGPS() {
      setInterval(() => {
        if (isRadarActive && navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            const gpsData = {
              phone: techSession.phone,
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              updatedAt: new Date().toISOString()
            };
            // حفظ آخر موقع للفني في السجل المركزي ليراها المشرف على الخريطة
            localStorage.setItem(`mucs_live_tech_${techSession.phone || 'default'}`, JSON.stringify(gpsData));
          }, null, { enableHighAccuracy: true });
        }
      }, 20000); // تحديث كل 20 ثانية
    }

    function toggleTechRadar() {
      isRadarActive = !isRadarActive;
      const btn = document.getElementById('radar-toggle-btn');
      const label = document.getElementById('radar-status-label');
      if (isRadarActive) {
        btn.textContent = "إيقاف مؤقت";
        btn.className = "px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-xs rounded-xl press-scale shadow-sm transition";
        label.textContent = "الرادار نشط (يستقبل طلبات)";
        label.className = "text-sm font-black text-emerald-400";
      } else {
        btn.textContent = "تفعيل الرادار";
        btn.className = "px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs rounded-xl press-scale shadow-sm transition";
        label.textContent = "الرادار متوقف (في استراحة)";
        label.className = "text-sm font-black text-amber-400";
      }
    }

    function acceptOrder(orderId) {
      alert(`تم قبول الطلب [${orderId}] بنجاح! تم إرسال إشعار للعميل وتفعيل نظام التوجيه الميداني.`);
    }

    function rejectOrder(orderId) {
      alert(`تم الاعتذار عن الطلب [${orderId}] وتوجيهه لفني آخر في المنطقة.`);
    }

    function executeTechLogout() {
      if (confirm('هل ترغب في تسليم الوردية وتسجيل الخروج؟')) {
        localStorage.removeItem('motqan_tech_session');
        window.location.replace('https://mutaqan.oxygen11.com');
      }
    }
  </script>
</body>
</html>
