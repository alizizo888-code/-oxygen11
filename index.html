<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <title>لوحة العميل | مُتقن</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-6 rounded-3xl shadow-xl max-w-md w-full text-center space-y-4">
    <h1 id="client-name" class="text-xl font-bold text-slate-900">أهلاً بك في لوحة العميل</h1>
    <p class="text-xs text-slate-500">نطاق العملاء: client.oxygen11.com</p>
    <button onclick="localStorage.removeItem('motqan_active_session'); window.location.replace('https://oxygen11.com');" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-bold text-xs">
      تسجيل الخروج والعودة للرئيسية
    </button>
  </div>
  <script>
    const session = JSON.parse(localStorage.getItem('motqan_active_session') || '{}');
    if (!session.role || session.role !== 'client') {
      window.location.replace('https://oxygen11.com');
    } else {
      document.getElementById('client-name').textContent = `أهلاً بك يا ${session.name}`;
    }
  </script>
</body>
</html>
